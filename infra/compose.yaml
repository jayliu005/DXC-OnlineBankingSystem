name: dxconlinebanking

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in infra/.env}
      APP_USER: DXCONLINEBANKING
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in infra/.env}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - dxconlinebanking_oracle_data:/opt/oracle/oradata

  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: DXCONLINEBANKING
      DB_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in infra/.env}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  dxconlinebanking_oracle_data:
    name: ${ORACLE_VOLUME_NAME:-dxconlinebanking_oracle_data}
